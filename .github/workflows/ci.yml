name: CI

on:
  push:
  pull_request:

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # dist 脚本已内建 --publish never（CI 下 electron-builder 会隐式发布，缺 GH_TOKEN 即报错；
      # 旗标经 npm -- 追加会与脚本内重复成数组使 never 失效，故固定在脚本里，这里不再传）
      - run: npm run dist
      - run: npm run test:packaged

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      # setup-android（含 v4）内部仍请求已被 Google 下架的 tools 包，全局性失败；
      # runner 预装完整 SDK，这里只需接受许可证即可
      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: chmod +x mobile/gradlew
      - run: npm run test:android
      - run: mobile/gradlew -p mobile assembleDebug
      - run: npm run test:android-release
