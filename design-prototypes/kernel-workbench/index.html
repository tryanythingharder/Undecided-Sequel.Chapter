  <title>内核工作台原型选型</title>
  <link rel="stylesheet" href="hub.css">

<body>
  <header>
    <div class="brand"><img src="../../build/cat.png" alt="六面世界黑猫图标"><div><strong>六面世界</strong><span>内核工作台原型选型</span></div></div>
    <a href="research.md">研究记录</a>
  </header>
  <main>
    <section class="intro">
      <span>三个可交互方向</span>
      <h1>选择工作台的空间语言</h1>
      <p>三套方案保留相同功能，只改变信息架构、空间分配与动效方式。点击任一方案进入完整原型。</p>
    </section>
    <section class="prototype-list">
      <article>
        <a class="preview" href="01-editorial-console/"><img src="previews/01-editorial-console-desktop.png" alt="编辑式控制台桌面预览"></a>
        <div class="meta"><div><span>编辑式控制台</span><h2>对话是主画布，内核库是索引。</h2></div><a href="01-editorial-console/">打开方案 01 ↗</a></div>
      </article>
      <article>
        <a class="preview" href="02-precision-studio/"><img src="previews/02-precision-studio-desktop.png" alt="精密工作室桌面预览"></a>
        <div class="meta"><div><span>精密工作室</span><h2>稳定、高效，适合长时间重复创作。</h2></div><a href="02-precision-studio/">打开方案 02 ↗</a></div>
      </article>
      <article>
        <a class="preview" href="03-spatial-atelier/"><img src="previews/03-spatial-atelier-desktop.png" alt="空间化工坊桌面预览"></a>
        <div class="meta"><div><span>空间化工坊</span><h2>用工作层与抽屉切换创作上下文。</h2></div><a href="03-spatial-atelier/">打开方案 03 ↗</a></div>
      </article>
    </section>
  </main>
