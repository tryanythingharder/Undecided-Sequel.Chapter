<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>六面世界 · 原型 B — 群青观测站</title>
<style>
/* ============================================================
   六面世界 · 交互原型 —— 方向 B「群青观测站」
   观测者的世界：世界线是左舷星图上的星座，叙事从取景框中传来，
   落账是轨道上亮起的信标。夜是主色调，昼是观测者小憩的白昼班。
   单文件自包含：无外部依赖、无网络请求，双击即用。
   ============================================================ */

/* ==SKIN:TOKENS== */
/* —— 方向 B 命名色（夜 · 主场）—— */
:root{
  --void:      #0B0E1A;   /* 外空 */
  --panel:     #121628;   /* 舱面板 */
  --panel-2:   #161B30;   /* 舱面板（次级） */
  --raise:     #1C2340;   /* 浮起面 */
  --star:      #D6E2F4;   /* 星光（正文） */
  --ultra:     #5B8DEF;   /* 群青（主操作 / 选中 / 线） */
  --neon:      #4ED6A9;   /* 信标绿（成功 / 落账） */
  --amber:     #E8B44A;   /* 琥珀（警示 / 待处理） */
  --flare:     #F0635A;   /* 赤焰（危险 / IF 分支） */
  --line:      #232A45;   /* 细线 */
  --line-strong:#313A5C;
  --star-dim:  rgba(214,226,244,.66);
  --star-faint:rgba(214,226,244,.40);
  --on-ultra:  #0B0E1A;
}
/* —— 方向 B 命名色（昼 · 白昼班）—— */
[data-mode="day"]{
  --void:      #EDF1F8;   /* 天光 */
  --panel:     #F7F9FD;  /* 舱面板 */
  --panel-2:   #F1F4FA;
  --raise:     #FFFFFF;
  --star:      #1E2A44;  /* 白昼班正文为深墨 */
  --ultra:     #2E5FD0;
  --neon:      #14805E;
  --amber:     #B07714;
  --flare:     #C9372B;
  --line:      #D7DDEA;
  --line-strong:#B9C2D8;
  --star-dim:  rgba(30,42,68,.66);
  --star-faint:rgba(30,42,68,.42);
  --on-ultra:  #FFFFFF;
}

/* —— 字体角色 —— */
:root{
  --font-ui:  "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --font-read:"Songti SC","SimSun","STSong","NSimSun","Noto Serif SC",serif;   /* 观测记录 · 宋 */
  --font-alt: "Kaiti SC","KaiTi","STKaiti","DFKai-SB",serif;                    /* 记录 · 楷（备选） */
  --font-mono:"Cascadia Code","SF Mono",Consolas,"Courier New",monospace;      /* 台账 · 等宽 */
}
html[data-font="kai"]{ --font-read: var(--font-alt); }
html[data-font="sans"]{ --font-read: var(--font-ui); }

/* —— 刻度与动效 —— */
:root{
  --fs-ui:13.5px; --fs-meta:11.5px; --fs-read:17px; --fs-title:30px;
  --r-pill:999px; --r-hud:10px; --r-node:3px;
  --sh-1:0 1px 2px rgba(0,0,0,.25);
  --sh-2:0 6px 24px rgba(0,0,0,.35);
  --sh-3:0 16px 48px rgba(0,0,0,.45);
  --dur-1:130ms; --dur-2:200ms; --dur-3:260ms; --dolark:260ms;
  --dur-4:460ms;
  --ease-std: cubic-bezier(.2,0,0,1);
  --ease-out:cubic-bezier(0,0,0,1);
  --ease-in:  cubic-bezier(.3,0,1,1);
  --ease-bounce: cubic-bezier(.34,1.56,.42,1);
  --read:38em;
  --gap:14px;
}
html[data-width="narrow"]{ --read:34em; }
html[data-width="wide"]  { --read:43em; }
html[data-density="compact"]{ --gap:10px; --fs-read:15.5px; }
html[data-density="relaxed"]{ --gap:18px; --fs-read:18.5px; }

/* ==END-SKIN== */

/* ================= 基底 ================= */
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; }
body{
  font-family:var(--font-ui); font-size:var(--fs-ui); color:var(--star);
  background:var(--void);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow:hidden;
}
/* 外空星尘 */
#starfield{
  position:fixed; inset:0; z-index:0; pointer-events:none;
}
#starfield canvas{ display:block; width:100%; height:100%; }
[data-mode="day"] #starfield{ opacity:.55; }

/* ================= 布局骨架：舱体 ================= */
#bridge{
  position:relative; z-index:1; height:100%;
  display:grid;
  grid-template-columns: 264px minmax(0,1fr);
  grid-template-rows: 44px minmax(0,1fr) auto;
  grid-template-areas:
    "deck deck"
    "scope main"
    "console console";
  transition:grid-template-columns var(--dur-3) var(--ease-std);
}
#bridge.scope-collapsed{ grid-template-columns: 0px minmax(0,1fr); }
#bridge.scope-collapsed #scope{ opacity:0; }

/* —— 顶栏（甲板） —— */
#deck{
  grid-area:deck; position:relative; z-index:40;
  display:flex; align-items:center; gap:10px;
  padding:0 14px; height:44px;
  background:color-mix(in srgb, var(--panel) 88%, transparent);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.brand{
  display:flex; align-items:center; gap:8px; flex:none;
  font-weight:700; font-size:14px; letter-spacing:.04em;
  user-select:none; cursor:pointer;
}
.brand-mark{
  width:22px; height:22px; border-radius:50%;
  background:radial-gradient(circle at 34% 30%, var(--ultra), color-mix(in srgb, var(--ultra) 40%, var(--void)) 75%);
  box-shadow:0 0 10px color-mix(in srgb, var(--ultra) 55%, transparent);
  position:relative;
}
.brand-mark::after{
  content:""; position:absolute; right:-5px; bottom:-2px;
  width:6px; height:6px; border-radius:50%; background:var(--neon);
  box-shadow:0 0 6px var(--neon);
}
.brand small{ font-weight:400; font-size:11px; color:var(--star-faint); letter-spacing:.14em; }
.deck-sep{ width:1px; height:18px; background:var(--line-strong); flex:none; }

/* 模式段控（观测 / 设计） */
.mode-seg{
  display:flex; gap:2px; padding:2px;
  background:var(--raise); border:1px solid var(--line); border-radius:var(--r-hud);
}
.mode-seg button{
  border:0; background:transparent; color:var(--star-dim);
  font-family:inherit; font-size:12.5px; padding:4px 14px; border-radius:7px;
  cursor:pointer; transition:all var(--dur-1) var(--ease-std);
}
.mode-seg button.on{
  background:var(--ultra); color:var(--on-ultra); font-weight:600;
  box-shadow:0 0 12px color-mix(in srgb, var(--ultra) 40%, transparent);
}
.deck-crumb{
  flex:1; min-width:0; display:flex; align-items:center; gap:8px;
  font-size:var(--fs-meta); color:var(--star-faint);
  overflow:hidden; white-space:nowrap;
}
.deck-crumb b{ color:var(--star-dim); font-weight:600; overflow:hidden; text-overflow:ellipsis; }
.deck-crumb .crumb-warn{ color:var(--amber); }
.deck-actions{ display:flex; align-items:center; gap:6px; flex:none; }

/* 圆形图标钮 */
.ibtn{
  width:30px; height:30px; border-radius:50%;
  border:1px solid var(--line-strong); background:transparent; color:var(--star-dim);
  font-family:inherit; font-size:13px; line-height:1;
  display:grid; place-items:center; cursor:pointer; position:relative;
  transition:all var(--dur-1) var(--ease-std);
}
.ibtn:hover{ color:var(--star); border-color:var(--ultra); background:color-mix(in srgb, var(--ultra) 10%, transparent); }
.ibtn.on{ color:var(--on-ultra); background:var(--ultra); border-color:var(--ultra); }
.ibtn .badge{
  position:absolute; top:-4px; right:-4px; width:8px; height:8px; border-radius:50%;
  background:var(--amber); box-shadow:0 0 6px var(--amber); display:none;
}
.ibtn .badge.on{ display:block; }

/* HUD 顶条：夜/昼班切换 */
.deck-night{
  display:flex; align-items:center; gap:5px; padding:3px 10px;
  border:1px solid var(--line-strong); border-radius:var(--r-pill);
  background:transparent; color:var(--star-dim);
  font-family:inherit; font-size:11.5px; cursor:pointer;
  transition:all var(--dolark) var(--ease-std);
}
.deck-night:hover{ border-color:var(--ultra); color:var(--star); }

/* ================= 左舷：星图星座导航 ================= */
#scope{
  grid-area:scope; position:relative; z-index:20;
  display:flex; flex-direction:column;
  background:color-mix(in srgb, var(--panel) 94%, transparent);
  border-right:1px solid var(--line);
  overflow:hidden;
}
#scope::before{ /* 舱窗弧光 */
  content:""; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(140% 60% at 0% 0%, color-mix(in srgb, var(--ultra) 7%, transparent), transparent 55%);
}
.scope-head{
  flex:none; padding:12px 14px 8px;
  display:flex; align-items:baseline; justify-content:space-between; gap:8px;
}
.scope-head h2{ font-size:12px; font-weight:700; letter-spacing:.22em; color:var(--star-dim); }
.scope-head .sh-sub{ font-size:10px; color:var(--star-faint); letter-spacing:.12em; }
.scope-tools{ display:flex; gap:4px; }
.scope-tools button{
  border:0; background:transparent; color:var(--star-faint);
  font-family:inherit; font-size:10.5px; padding:2px 6px; border-radius:4px; cursor:pointer;
  transition:all var(--dur-1);
}
.scope-tools button:hover{ color:var(--ultra); background:color-mix(in srgb, var(--ultra) 12%, transparent); }

/* 星图主体：SVG 星座 */
#starmap{
  flex:1; min-height:0; position:relative;
  display:flex; flex-direction:column; overflow:hidden;
}
#starmap-svg{
  flex:1; width:100%; min-height:120px;
  background:transparent;
}
#starmap-list{ /* 星座下方：世界线清册 */
  flex:none; max-height:38%; overflow:auto;
  border-top:1px solid var(--line); padding:8px 10px 12px;
}
.sm-caption{
  font-size:10px; color:var(--star-faint); letter-spacing:.18em;
  padding:2px 2px 6px;
}
.sm-row{
  display:flex; align-items:center; gap:8px;
  padding:6px 8px; border-radius:var(--r-hud); cursor:pointer;
  transition:background var(--dur-1);
}
.sm-row:hover{ background:color-mix(in srgb, var(--ultra) 8%, transparent); }
.sm-row.cur{ background:color-mix(in srgb, var(--ultra) 14%, transparent); }
.sm-row .sm-dot{
  width:8px; height:8px; border-radius:50%; flex:none;
  background:var(--star-faint);
}
.sm-row.cur .sm-dot{ background:var(--ultra); box-shadow:0 0 8px var(--ultra); }
.sm-row.if .sm-dot{ background:var(--flare); box-shadow:0 0 8px color-mix(in srgb, var(--flare) 60%, transparent); }
.sm-row .sm-name{ flex:1; font-size:12.5px; color:var(--star-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sm-row.cur .sm-name{ color:var(--star); font-weight:600; }
.sm-row .sm-r{ font-family:var(--font-mono); font-size:10px; color:var(--star-faint); }

/* 新建按钮 */
.scope-new{
  margin:8px 12px 12px; padding:8px;
  border:1px dashed var(--line-strong); border-radius:var(--r-hud);
  background:transparent; color:var(--star-faint);
  font-family:inherit; font-size:12px; letter-spacing:.06em; cursor:pointer;
  transition:all var(--dur-2);
}
.scope-new:hover{ border-color:var(--ultra); color:var(--ultra); background:color-mix(in srgb, var(--ultra) 6%, transparent); }

/* ================= 主区：观测窗 ================= */
#main{
  grid-area:main; position:relative; z-index:10;
  display:flex; flex-direction:column; overflow:hidden;
  background:color-mix(in srgb, var(--void) 40%, transparent);
}

/* —— 取景框（观测窗叙事区） —— */
#viewport{
  flex:1; min-height:0; overflow:hidden; position:relative;
  display:flex; flex-direction:column;
}
#viewport::before{ /* 观测窗背景纵深（星云薄雾） */
  content:""; position:absolute; inset:0; pointer-events:none;
  background:
    radial-gradient(56% 46% at 62% 6%, color-mix(in srgb, var(--ultra) 9%, transparent), transparent 70%),
    radial-gradient(40% 36% at 10% 88%, color-mix(in srgb, var(--neon) 6%, transparent), transparent 70%);
}
/* 取景框四角 */
#viewport .corner{ position:absolute; width:22px; height:22px; z-index:5; pointer-events:none; }
#viewport .corner.tl{ top:10px; left:10px; border-top:2px solid var(--ultra); border-left:2px solid var(--ultra); }
#viewport .corner.tr{ top:10px; right:10px; border-top:2px solid var(--ultra); border-right:2px solid var(--ultra); }
#viewport .corner.bl{ bottom:10px; left:10px; border-bottom:2px solid var(--ultra); border-left:2px solid var(--ultra); }
#viewport .corner.br{ bottom:10px; right:10px; border-bottom:2px solid var(--ultra); border-right:2px solid var(--ultra); }
/* 取景框刻度读数 */
.vp-readout{
  position:absolute; top:14px; right:16px; z-index:5;
  font-family:var(--font-mono); font-size:10px; letter-spacing:.08em;
  color:var(--star-faint); user-select:none; pointer-events:none;
}
.vp-readout b{ color:var(--ultra); font-weight:400; }
.vp-readout .rec-dot{
  display:inline-block; width:6px; height:6px; border-radius:50%;
  background:var(--flare); margin-right:4px; vertical-align:1px;
  animation:rec-blink 1.6s ease infinite;
}
@keyframes rec-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.25; } }

/* 卷轴区 */
#scroll-host{
  flex:1; min-height:0; overflow:hidden auto; padding:44px 32px 32px;
  scrollbar-width:thin; scrollbar-color:var(--line-strong) transparent;
}
#scroll-host::-webkit-scrollbar{ width:8px; }
#scroll-host::-webkit-scrollbar-thumb{ background:var(--line-strong); border-radius:4px; }

/* —— 扉页（观测到新域） —— */
.frontis{
  width:var(--read); margin:0 auto; padding:9vh 0 24px;
}
.frontis .f-tag{
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:.3em;
  color:var(--ultra); margin-bottom:18px;
}
.frontis h1{
  font-size:40px; font-weight:700; letter-spacing:.02em; line-height:1.2;
  margin-bottom:10px;
  background:linear-gradient(105deg, var(--star) 40%, var(--ultra) 75%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  animation:front-rise var(--dur-4) var(--ease-out) both;
}
.frontis .f-sub{ font-size:14px; color:var(--star-dim); margin-bottom:36px; line-height:1.7; }
@keyframes front-rise{ from{ opacity:0; transform:translateY(14px); } }
.origin-list{ display:grid; gap:10px; }
.origin{
  display:flex; align-items:center; gap:14px; text-align:left;
  padding:14px 16px; border:1px solid var(--line-strong); border-radius:var(--r-hud);
  background:color-mix(in srgb, var(--panel-2) 70%, transparent);
  color:var(--star); font-family:inherit; font-size:inherit; cursor:pointer;
  transition:all var(--dur-2) var(--ease-std); position:relative; overflow:hidden;
}
.origin::before{ /* 选中扫光 */
  content:""; position:absolute; inset:0;
  background:linear-gradient(100deg, transparent 30%, color-mix(in srgb, var(--ultra) 22%, transparent) 50%, transparent 70%);
  transform:translateX(-120%); transition:transform .7s var(--ease-std);
}
.origin:hover{ border-color:var(--ultra); transform:translateY(-2px);
  box-shadow:0 0 0 1px var(--ultra), 0 10px 30px color-mix(in srgb, var(--ultra) 20%, transparent); }
.origin:hover::before{ transform:translateX(120%); }
.origin .o-zi{
  width:44px; height:44px; flex:none; display:grid; place-items:center;
  font-family:var(--font-read); font-size:22px; font-weight:700; color:var(--ultra);
  border:1px solid color-mix(in srgb, var(--ultra) 45%, transparent); border-radius:50%;
  background:color-mix(in srgb, var(--ultra) 8%, transparent);
}
.origin .o-body{ flex:1; min-width:0; }
.origin .o-body b{ display:block; font-size:14.5px; margin-bottom:3px; }
.origin .o-body span{ display:block; font-size:12px; color:var(--star-faint); line-height:1.55; }
.origin .o-arrow{ font-size:12px; color:var(--star-faint); transition:all var(--dur-2); flex:none; }
.origin:hover .o-arrow{ color:var(--ultra); transform:translateX(4px); }

/* —— 观测流（叙事回合） —— */
.beats{ width:var(--read); margin:0 auto; display:flex; flex-direction:column; gap:var(--gap); }

/* 一幕（助手回合）：轨道节点 */
.beat{
  position:relative; padding-left:34px;
  animation:beat-dock var(--dur-3) var(--ease-out) both;
}
@keyframes beat-dock{
  from{ opacity:0; transform:translateY(10px); }
}
.beat::before{ /* 轨道线 */
  content:""; position:absolute; left:12px; top:8px; bottom:-2px; width:2px;
  background:linear-gradient(to bottom, var(--line-strong), color-mix(in srgb, var(--line-strong) 40%, transparent));
  border-radius:2px;
}
.beat.last::before{ bottom:calc(100% - 16px); }
.beat::after{ /* 节点信标 */
  content:""; position:absolute; left:7px; top:8px;
  width:10px; height:10px; border-radius:50%;
  border:2.5px solid var(--ultra); background:var(--void);
  transition:all var(--dur-3);
}
.beat[data-commit="ok"]::after{
  border-color:var(--neon); background:var(--neon);
  box-shadow:0 0 10px color-mix(in srgb, var(--neon) 65%, transparent);
}
.beat[data-commit="pending"]::after,
.beat[data-commit="retry"]::after{
  border-color:var(--amber); background:var(--amber);
  box-shadow:0 0 10px color-mix(in srgb, var(--amber) 60%, transparent);
}
.beat.error::after{ border-color:var(--flare); background:var(--flare); }
.beat[data-illust="1"]::after{ box-shadow:0 0 0 4px color-mix(in srgb, var(--ultra) 18%, transparent), 0 0 10px color-mix(in srgb, var(--neon) 50%, transparent); }

/* 场景行（时位坐标） */
.beat-scene{
  display:flex; align-items:center; gap:10px; margin-bottom:12px;
  font-family:var(--font-mono); font-size:11px; letter-spacing:.1em;
  color:var(--star-dim);
}
.beat-scene .sc-dot{ width:5px; height:5px; border-radius:50%; background:var(--ultra); flex:none; }
.beat-scene .sc-rule{ flex:1; height:1px; background:linear-gradient(to right, var(--line-strong), transparent); }

/* 叙事排版（观测记录体） */
.beat-narr{
  font-family:var(--font-read); font-size:var(--fs-read); line-height:2.05;
  color:var(--star); text-align:justify; text-justify:inter-ideograph;
}
.beat-narr p{ margin:0 0 .2em; }
.beat-narr p.indent{ text-indent:2em; }
.beat-narr .ask{
  color:var(--ultra); font-weight:700; margin:0.6em 0 .3em;
}
.beat-narr .ask::before{ content:"◈ "; }
.beat-narr strong{ font-weight:700; color:var(--star); }
/* 状态台账 */
.status-panel{
  margin:10px 0 4px; padding:9px 14px;
  border:1px solid var(--line-strong); border-radius:var(--r-hud);
  background:color-mix(in srgb, var(--panel) 55%, transparent);
  font-family:var(--font-mono); font-size:11.5px; line-height:1.9; color:var(--star-dim);
  letter-spacing:.02em;
}
.status-panel::before{
  content:"SIM-STATE"; font-size:9px; letter-spacing:.22em; color:var(--star-faint);
  display:block; margin-bottom:4px;
}

/* 观测批注（朱批 → 观测附注） */
.zhu-note{
  position:relative; margin:12px 0 0 34px; padding:10px 14px 10px 38px;
  border-left:2px solid var(--ultra);
  background:color-mix(in srgb, var(--panel) 60%, transparent);
  border-radius:0 var(--r-hud) var(--r-hud) 0;
  font-size:12.5px; color:var(--star-dim); line-height:1.7;
}
.zhu-note .zhu-b{
  position:absolute; left:12px; top:10px;
  font-family:var(--font-mono); font-size:9px; letter-spacing:.18em;
  color:var(--ultra);
  writing-mode:vertical-rl;
}
.zhu-note:hover .zhu-ops{ opacity:1; }
.zhu-ops{
  display:flex; gap:6px; margin-top:6px; opacity:0;
  transition:opacity var(--dur-2);
}
.zhu-ops button{
  border:0; background:transparent; color:var(--star-faint);
  font-family:inherit; font-size:10.5px; padding:2px 8px; cursor:pointer;
  border-radius:var(--r-pill); border:1px solid transparent;
  transition:all var(--dur-1);
}
.zhu-ops button:hover{ color:var(--ultra); border-color:color-mix(in srgb, var(--ultra) 40%, transparent); }

/* 选项卡（便笺 → 频段选项） */
.choices{
  margin:14px 0 2px 34px; padding:12px;
  border:1px solid var(--line); border-radius:var(--r-hud);
  background:color-mix(in srgb, var(--panel-2) 45%, transparent);
  display:flex; flex-direction:column; gap:8px;
}
.choices::before{
  content:"频段选项 · SELECT CHANNEL"; font-family:var(--font-mono);
  font-size:9px; letter-spacing:.2em; color:var(--star-faint); margin-bottom:2px;
}
.choice{
  display:flex; align-items:center; gap:10px; text-align:left;
  padding:9px 12px; border:1px solid transparent; border-radius:8px;
  background:transparent; color:var(--star); font-family:inherit; font-size:13.5px;
  cursor:pointer; transition:all var(--dur-1) var(--ease-std); position:relative;
}
.choice::before{
  content:attr(data-k); font-family:var(--font-mono); font-size:10.5px;
  color:var(--ultra); width:18px; flex:none;
}
.choice:hover{
  border-color:var(--ultra);
  background:color-mix(in srgb, var(--ultra) 10%, transparent);
  transform:translateX(3px);
}
.choice:hover::after{ content:"◂"; position:absolute; right:12px; color:var(--ultra); font-size:11px; }
.choice:disabled{ opacity:.4; cursor:not-allowed; }
.choice.picked{ color:var(--star-faint); font-style:italic; }

/* 提交按钮 */
.commit-btn{
  align-self:flex-start; margin:6px 0 0 34px;
  display:inline-flex; align-items:center; gap:8px;
  padding:9px 22px; border:0; border-radius:var(--r-pill);
  background:var(--ultra); color:var(--on-ultra);
  font-family:inherit; font-size:13px; font-weight:600; letter-spacing:.06em; cursor:pointer;
  box-shadow:0 0 18px color-mix(in srgb, var(--ultra) 40%, transparent);
  transition:all var(--dur-2) var(--ease-std);
}
.commit-btn:hover{ transform:translateY(-1px); box-shadow:0 0 26px color-mix(in srgb, var(--ultra) 55%, transparent); }
.commit-btn:disabled{ opacity:.45; cursor:not-allowed; transform:none; }

/* 落账信标 */
.beat-seal{
  display:inline-flex; align-items:center; gap:7px; margin-top:12px;
  font-family:var(--font-mono); font-size:11px; color:var(--neon);
  opacity:0;
}
.beat-seal.stamped{ animation:seal-in var(--dur-4) var(--ease-bounce) both; }
@keyframes seal-in{
  0%{ opacity:0; transform:translateY(-8px) scale(.9); }
  55%{ opacity:1; transform:translateY(0) scale(1.06); }
  100%{ opacity:1; transform:scale(1); }
}
.beat-seal .seal-glyph{
  width:18px; height:18px; flex:none; display:grid; place-items:center;
  border:1.5px solid currentColor; border-radius:50%;
  font-size:9px; font-weight:700;
}
.beat-seal.loading{ color:var(--star-faint); }
.beat-seal.loading .seal-glyph{ border-style:dashed; animation:spin 2.2s linear infinite; }
.beat-seal.pending{ color:var(--amber); }
.beat-seal.pending .seal-glyph{ border-style:dashed; }
.beat-seal button{
  font-size:11px; color:var(--amber); text-decoration:underline dotted; padding:0 2px;
}
@keyframes spin{ to{ transform:rotate(360deg); } }

/* 用户行（传输上行） */
.userline{
  display:flex; justify-content:flex-start; gap:10px; align-items:flex-start;
  margin:4px 0 2px; padding-left:34px;
  animation:beat-dock var(--dur-3) var(--ease-out) both;
}
.userline .ul-role{
  flex:none; font-family:var(--font-mono); font-size:9.5px; letter-spacing:.16em;
  color:var(--flare); padding-top:5px;
}
.userline .ul-body{
  padding:10px 16px; border-radius:4px 14px 14px 14px;
  background:color-mix(in srgb, var(--panel) 85%, transparent);
  border:1px solid var(--line-strong);
  font-family:var(--font-read); font-size:14.5px; line-height:1.8; color:var(--star);
  max-width:86%;
}
.userline.pick .ul-body{ background:color-mix(in srgb, var(--flare) 10%, var(--panel)); border-color:color-mix(in srgb, var(--flare) 35%, var(--line-strong)); }

/* 空态 */
.empty-note{
  width:var(--read); margin:16vh auto 0; text-align:center; color:var(--star-faint);
}
.empty-note .en-glyph{
  font-size:40px; color:var(--ultra); opacity:.35; margin-bottom:14px;
  animation:empty-drift 5s ease-in-out infinite;
}
@keyframes empty-drift{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-8px); } }
.empty-note h3{ font-size:15px; color:var(--star-dim); font-weight:600; margin-bottom:8px; }
.empty-note p{ font-size:12.5px; line-height:1.8; }

/* IF 分叉提示 */
.fork-flag{
  display:inline-flex; align-items:center; gap:6px;
  margin:2px 0 6px 34px; padding:4px 12px;
  border:1px dashed color-mix(in srgb, var(--flare) 55%, transparent); border-radius:var(--r-pill);
  color:var(--flare); font-family:var(--font-mono); font-size:10.5px; letter-spacing:.08em;
}

/* 插图（观测影像） */
.illust-wrap{
  margin:14px 0 6px 34px; position:relative;
  border:1px solid var(--line-strong); border-radius:var(--r-hud);
  padding:8px; background:color-mix(in srgb, var(--panel) 60%, transparent);
  animation:beat-dock var(--dur-3) var(--ease-out) both;
}
.illust-wrap .il-tag{
  position:absolute; top:-9px; left:12px; padding:1px 10px;
  background:var(--panel); border:1px solid var(--line-strong); border-radius:var(--r-pill);
  font-family:var(--font-mono); font-size:9px; letter-spacing:.2em; color:var(--star-faint);
}
.illust-wrap svg{ display:block; width:100%; height:auto; border-radius:6px; }

/* ================= 底部：传输台 ================= */
#console-bar{
  grid-area:console; position:relative; z-index:30;
  display:flex; align-items:stretch; gap:12px;
  padding:12px 16px;
  background:color-mix(in srgb, var(--panel) 92%, transparent);
  backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
}
.console-main{ flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; }
.console-top{
  display:flex; align-items:center; gap:8px;
  font-family:var(--font-mono); font-size:10px; letter-spacing:.14em; color:var(--star-faint);
}
.console-top .ct-live{ display:flex; align-items:center; gap:5px; color:var(--neon); }
.console-top .ct-live i{ width:6px; height:6px; border-radius:50%; background:var(--neon); box-shadow:0 0 6px var(--neon); }
.console-top .ct-spark{ flex:1; height:12px; position:relative; overflow:hidden; }
.console-top .ct-spark canvas{ position:absolute; inset:0; width:100%; height:100%; }
.console-top .ct-proc{ color:var(--star-faint); }
.console-input-row{ display:flex; gap:8px; align-items:flex-end; }
#com-input{
  flex:1; resize:none; border:1px solid var(--line-strong); border-radius:12px;
  background:color-mix(in srgb, var(--void) 40%, var(--panel-2));
  color:var(--star); font-family:var(--font-read); font-size:15px; line-height:1.7;
  padding:10px 14px; outline:0; caret-color:var(--ultra);
  transition:border-color var(--dur-1), box-shadow var(--dur-1);
}
#com-input:focus{ border-color:var(--ultra); box-shadow:0 0 0 3px color-mix(in srgb, var(--ultra) 16%, transparent); }
#com-input::placeholder{ color:var(--star-faint); }
#com-send{
  flex:none; width:46px; height:46px; border-radius:14px; border:0; cursor:pointer;
  background:var(--ultra); color:var(--on-ultra); font-size:17px;
  box-shadow:0 0 16px color-mix(in srgb, var(--ultra) 40%, transparent);
  transition:all var(--dur-2) var(--ease-std);
}
#com-send:hover{ transform:translateY(-1px); box-shadow:0 0 24px color-mix(in srgb, var(--ultra) 60%, transparent); }
#com-send:disabled{ opacity:.4; transform:none; }
.com-tools{ display:flex; align-items:flex-end; gap:6px; }
.com-tools .ibtn{ width:34px; height:34px; }
#com-multi.on{ color:var(--amber); border-color:var(--amber); background:color-mix(in srgb, var(--amber) 12%, transparent); }
#com-spark2{ width:34px; height:34px; border-radius:10px; border:1px solid var(--line-strong); background:transparent; color:var(--star-faint); cursor:pointer; font-size:13px; font-family:var(--font-mono); transition:all var(--dur-1); }
#com-spark2:hover{ color:var(--neon); border-color:var(--neon); }
#com-spark2.on{ color:var(--on-ultra); background:var(--ultra); border-color:var(--ultra); }

/* ================= HUD 芯片列 ================= */
#hud-row{
  flex:none; display:flex; align-items:center; gap:6px; padding:6px 0 2px;
  overflow-x:auto; scrollbar-width:none;
}
#hud-row::-webkit-scrollbar{ display:none; }
.hchip{
  display:inline-flex; align-items:center; gap:5px; flex:none;
  padding:3px 11px 3px 8px; border:1px solid var(--line-strong); border-radius:var(--r-pill);
  background:color-mix(in srgb, var(--panel-2) 60%, transparent);
  font-family:var(--font-mono); font-size:10px; letter-spacing:.06em; color:var(--star-dim);
  cursor:default; transition:all var(--dur-1);
}
.hchip i{ width:6px; height:6px; border-radius:50%; background:var(--star-faint); flex:none; }
.hchip.ok i{ background:var(--neon); }
.hchip.warn i{ background:var(--amber); }
.hchip.hot i{ background:var(--flare); }
.hchip.clickable{ cursor:pointer; }
.hchip.clickable:hover{ border-color:var(--ultra); color:var(--star); }
.hchip b{ font-weight:600; color:var(--star); }

/* ================= 抽屉（右侧滑入面板） ================= */
.drawer{
  position:fixed; top:0; right:0; bottom:0; z-index:60; width:min(440px, 100vw);
  background:var(--panel); border-left:1px solid var(--line-strong);
  transform:translateX(105%); visibility:hidden;
  transition:transform var(--dur-3) var(--ease-std), visibility var(--dur-3);
  display:flex; flex-direction:column;
  box-shadow:var(--sh-3);
}
.drawer.open{ transform:none; visibility:visible; }
.drawer-head{
  flex:none; display:flex; align-items:center; gap:10px;
  padding:14px 16px; border-bottom:1px solid var(--line);
}
.drawer-head h3{ font-size:14px; font-weight:700; letter-spacing:.04em; flex:1; }
.drawer-head .dh-sub{ font-size:10px; color:var(--star-faint); letter-spacing:.18em; font-family:var(--font-mono); }
.drawer-close{
  width:28px; height:28px; border-radius:8px; border:0; background:transparent;
  color:var(--star-faint); font-size:15px; cursor:pointer; transition:all var(--dur-1);
}
.drawer-close:hover{ color:var(--flare); background:color-mix(in srgb, var(--flare) 12%, transparent); }
.drawer-body{ flex:1; min-height:0; overflow:auto; padding:16px; }
.drawer-body::-webkit-scrollbar{ width:6px; }
.drawer-body::-webkit-scrollbar-thumb{ background:var(--line-strong); border-radius:3px; }

/* 通用小节 */
.sec-label{
  font-family:var(--font-mono); font-size:10px; letter-spacing:.22em;
  color:var(--ultra); margin:18px 0 8px;
}
.sec-label:first-child{ margin-top:0; }
.kv-grid{ display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:12.5px; }
.kv-grid dt{ color:var(--star-faint); }
.kv-grid dd{ color:var(--star-dim); }

/* —— 抽屉：信标台账（检查册 → 观测台账） —— */
.ledger-cells{ display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
.lcell{
  padding:10px 12px; border:1px solid var(--line); border-radius:var(--r-hud);
  background:color-mix(in srgb, var(--panel-2) 55%, transparent);
  transition:all var(--dur-2);
}
.lcell:hover{ border-color:var(--ultra); }
.lcell .lc-num{ font-family:var(--font-mono); font-size:22px; font-weight:700; color:var(--star); line-height:1.2; }
.lcell .lc-name{ font-size:10.5px; color:var(--star-faint); margin-top:2px; letter-spacing:.06em; }
.lcell.lit .lc-num{ color:var(--neon); }

/* 台账时间线 */
.turnlog-list{ display:flex; flex-direction:column; gap:6px; }
.tlog{
  display:flex; align-items:center; gap:8px;
  padding:7px 10px; border-radius:8px;
  background:color-mix(in srgb, var(--panel-2) 45%, transparent);
  font-family:var(--font-mono); font-size:10.5px; color:var(--star-dim);
}
.tlog .tl-status{ width:7px; height:7px; border-radius:50%; flex:none; }
.tlog.ok .tl-status{ background:var(--neon); }
.tlog.retry .tl-status{ background:var(--amber); }
.tlog.pending .tl-status{ background:var(--amber); }
.tlog.error .tl-status{ background:var(--flare); }
.tlog .tl-num{ color:var(--star-faint); width:34px; flex:none; }
.tlog .tl-patch{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--star-faint); }
.tlog button{ border:0; background:transparent; color:var(--ultra); font-family:inherit; font-size:10px; cursor:pointer; padding:0 2px; }
.tlog button:hover{ text-decoration:underline; }

/* 快照（星图锚点） */
.snap-shelf{ display:grid; gap:8px; }
.snap-item{
  display:flex; align-items:center; gap:10px;
  padding:10px 12px; border:1px solid var(--line); border-radius:var(--r-hud);
  background:color-mix(in srgb, var(--panel-2) 50%, transparent);
}
.snap-item .si-glyph{
  width:34px; height:34px; flex:none; display:grid; place-items:center;
  border:1px dashed var(--line-strong); border-radius:8px;
  color:var(--star-faint); font-family:var(--font-mono); font-size:9px;
}
.snap-item .si-body{ flex:1; min-width:0; }
.snap-item .si-name{ font-size:12.5px; color:var(--star-dim); }
.snap-item .si-meta{ font-family:var(--font-mono); font-size:9.5px; color:var(--star-faint); margin-top:2px; letter-spacing:.05em; }
.snap-item .si-ops{ display:flex; gap:4px; }
.snap-item .si-ops button{
  border:0; background:transparent; color:var(--star-faint);
  font-family:inherit; font-size:10px; padding:3px 7px; border-radius:6px; cursor:pointer;
  transition:all var(--dur-1);
}
.snap-item .si-ops button:hover{ color:var(--ultra); background:color-mix(in srgb, var(--ultra) 10%, transparent); }
.snap-item .si-ops button.danger:hover{ color:var(--flare); background:color-mix(in srgb, var(--flare) 10%, transparent); }
.snap-count{
  font-family:var(--font-mono); font-size:10px; color:var(--star-faint); letter-spacing:.1em;
  margin:4px 0 8px;
}

/* —— 抽屉：影集（观测影像库） —— */
.gal-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.gal-item{
  border:1px solid var(--line); border-radius:var(--r-hud); overflow:hidden; cursor:zoom-in;
  background:var(--panel-2); position:relative;
  transition:all var(--dur-2) var(--ease-std);
}
.gal-item:hover{ border-color:var(--ultra); transform:translateY(-2px); box-shadow:0 8px 24px color-mix(in srgb, var(--ultra) 18%, transparent); }
.gal-item svg{ display:block; width:100%; height:auto; }
.gal-item .gal-cap{
  padding:7px 10px; font-size:11px; color:var(--star-faint); line-height:1.5;
  border-top:1px solid var(--line);
  background:var(--panel);
}
.gal-empty{ grid-column:1/-1; text-align:center; padding:36px 0; color:var(--star-faint); font-size:12px; }

/* —— 抽屉：内核库（设计页复用） —— */
.kl-grid{ display:grid; gap:10px; }
.kcard{
  text-align:left; padding:13px 14px; border:1px solid var(--line-strong); border-radius:var(--r-hud);
  background:color-mix(in srgb, var(--panel-2) 60%, transparent); color:var(--star);
  font-family:inherit; cursor:pointer; transition:all var(--dur-2) var(--ease-std); position:relative;
}
.kcard .kc-top{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.kcard .kc-title{ font-size:14px; font-weight:700; flex:1; }
.kcard .kc-ver{ font-family:var(--font-mono); font-size:9.5px; color:var(--star-faint); letter-spacing:.06em; }
.kcard .kc-sub{ font-size:11.5px; color:var(--star-faint); line-height:1.6; margin-bottom:8px; }
.kcard .kc-tags{ display:flex; flex-wrap:wrap; gap:5px; }
.kcard .kc-tag{
  font-size:9.5px; padding:2px 8px; border-radius:var(--r-pill);
  border:1px solid var(--line-strong); color:var(--star-faint); letter-spacing:.04em;
}
.kcard:hover{ border-color:var(--ultra); }
.kcard.applied{ border-color:var(--neon); box-shadow:0 0 0 1px var(--neon), 0 0 18px color-mix(in srgb, var(--neon) 15%, transparent); }
.kcard.applied::after{
  content:"已装载"; position:absolute; top:10px; right:12px;
  font-family:var(--font-mono); font-size:9px; color:var(--neon); letter-spacing:.14em;
}
.kcard.draft .kc-ver{ color:var(--amber); }
.kcard.archived{ opacity:.55; }
.kcard.archived .kc-ver{ color:var(--star-faint); }

/* ================= 设计模式（内核工坊） ================= */
.design-host{ flex:1; min-height:0; overflow:auto; padding:36px 32px 60px; }
.design-wrap{ width:min(860px, 100%); margin:0 auto; }
.dsn-head{ margin-bottom:26px; }
.dsn-head .f-tag{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:.3em; color:var(--ultra); margin-bottom:12px; }
.dsn-head h1{ font-size:32px; font-weight:700; margin-bottom:8px; }
.dsn-head .f-sub{ font-size:13.5px; color:var(--star-dim); line-height:1.7; }
.dsn-sec{ margin:28px 0; }
.dsn-sec h2{
  font-size:16px; font-weight:700; margin-bottom:4px;
  padding-left:12px; border-left:3px solid var(--ultra);
}
.dsn-sec .dsn-note{ font-size:12px; color:var(--star-faint); margin:6px 0 14px 15px; line-height:1.6; }
.checkline{
  display:flex; align-items:flex-start; gap:10px;
  padding:12px 14px; margin-bottom:8px;
  border:1px solid var(--line); border-radius:var(--r-hud);
  background:color-mix(in srgb, var(--panel-2) 50%, transparent);
  transition:all var(--dur-2);
}
.checkline:hover{ border-color:var(--ultra); }
.checkline .ck-box{
  width:20px; height:20px; flex:none; border-radius:6px; margin-top:1px;
  border:1.5px solid var(--line-strong); display:grid; place-items:center;
  cursor:pointer; transition:all var(--dur-2) var(--ease-bounce);
  color:transparent; font-size:12px; line-height:1;
}
.checkline.done .ck-box{
  background:var(--neon); border-color:var(--neon); color:var(--void);
  transform:scale(1.05);
}
.checkline .ck-body{ flex:1; }
.checkline .ck-title{ font-size:13.5px; font-weight:600; margin-bottom:3px; }
.checkline.done .ck-title{ color:var(--star-dim); }
.checkline .ck-desc{ font-size:11.5px; color:var(--star-faint); line-height:1.6; }
.checkline.done{ opacity:.72; }
.dsn-progress{
  display:flex; align-items:center; gap:10px; margin:16px 0 0 15px;
  font-family:var(--font-mono); font-size:10.5px; color:var(--star-faint); letter-spacing:.08em;
}
.dsn-progress .dp-bar{ flex:1; height:3px; border-radius:2px; background:var(--line); overflow:hidden; }
.dsn-progress .dp-bar i{ display:block; height:100%; background:linear-gradient(90deg, var(--ultra), var(--neon)); border-radius:2px; transition:width var(--dur-4) var(--ease-std); }

/* 内核源码编辑器 */
.src-editor{
  width:100%; min-height:320px; resize:vertical;
  border:1px solid var(--line-strong); border-radius:var(--r-hud);
  background:color-mix(in srgb, var(--void) 55%, var(--panel-2));
  color:var(--star); font-family:var(--font-mono); font-size:12px; line-height:1.8;
  padding:14px 16px; outline:0; caret-color:var(--ultra);
}
.src-editor:focus{ border-color:var(--ultra); box-shadow:0 0 0 3px color-mix(in srgb, var(--ultra) 14%, transparent); }

/* ================= 桌宠：信标卫星 ================= */
#pet{
  position:fixed; right:26px; bottom:158px; z-index:50;
  width:58px; height:58px; cursor:pointer; user-select:none;
  display:var(--pet-display, block);
}
#pet.gone{ display:none; }
.pet-core{
  position:absolute; inset:6px; border-radius:50%;
  background:radial-gradient(circle at 36% 32%, #E8F1FF, var(--ultra) 58%, color-mix(in srgb, var(--ultra) 45%, var(--void)));
  box-shadow:0 0 18px color-mix(in srgb, var(--ultra) 65%, transparent), inset 0 -5px 12px rgba(8,10,22,.4);
  animation:pet-orbit-pulse 3.6s var(--ease-std) infinite;
}
@keyframes pet-orbit-pulse{
  0%,100%{ box-shadow:0 0 14px color-mix(in srgb, var(--ultra) 50%, transparent), inset 0 -5px 12px rgba(8,10,22,.4); }
  50%{ box-shadow:0 0 26px color-mix(in srgb, var(--ultra) 80%, transparent), inset 0 -5px 12px rgba(8,10,22,.4); }
}
.pet-ring{
  position:absolute; inset:0; border-radius:50%;
  border:1px dashed color-mix(in srgb, var(--ultra) 60%, transparent);
  animation:pet-spin 9s linear infinite;
}
.pet-ring::before{
  content:""; position:absolute; top:-3px; left:calc(50% - 3px);
  width:6px; height:6px; border-radius:50%; background:var(--neon);
  box-shadow:0 0 8px var(--neon);
}
@keyframes pet-spin{ to{ transform:rotate(360deg); } }
.pet-face{
  position:absolute; inset:0; display:grid; place-items:center;
  font-size:20px; color:var(--on-ultra);
  text-shadow:0 1px 4px rgba(8,10,22,.5);
}
.pet-face.sleep{ animation:pet-sleep-float 4s ease-in-out infinite; }

function typewrite(node, fullText, { cps = 88, onDone } = {}){
  return new Promise(resolve => {
    const start = performance.now(), total = fullText.length;

      const n = clamp(Math.floor((performance.now() - start) / 1000 * cps), 0, total);

  for (let i = 0; i < n; i++){
    nodes.push({
      x: 22 + (i / Math.max(n - 1, 1)) * (r() * 26 + 56),
      y: 14 + r() * 72,
      i,
    });
  }
  return nodes;
}
function renderStarmap(){
  const svg = document.getElementById('starmap-svg');

    inner += `<circle cx="${(rbg()*100).toFixed(1)}" cy="${(rbg()*100).toFixed(1)}" r="${(rbg()*.5+.2).toFixed(2)}" fill="var(--star-faint)" opacity="${(rbg()*.3+.08).toFixed(2)}"/>`;
  }
  lines.forEach((s, li) => {
    const nodes = sessionNodes(s);

    const dash = s.ifFrom ? ' stroke-dasharray="3 4"' : '';

    inner += `<text x="${(lab.x + 3).toFixed(1)}" y="${(lab.y + 3).toFixed(1)}" font-size="7" fill="${col}" opacity=".8">${esc(s.title.slice(0, 5))}</text>`;

function starMapRowMenu(e, s){

/* ============================================================

function ledgerTotal(){

}
function refreshDeck(){

  store.sessions.forEach(x => x.msgs.forEach(m => { if (m.commit === 'pending') pendingMsgs.push(m); }));

  if (pendingMsgs.length) chips.push({ k:'warn clickable', label:`待同步 <b>${pendingMsgs.length}</b>`, run:() => openDrawer('ledger') });
  chips.push({ k:'ok', label:`快照 <b>${snaps.length}</b>/30` });
  if (s && s.ifFrom) chips.push({ k:'hot', label:`IF 分支` });

/* ============================================================
   取景框：叙事流渲染
   ============================================================ */
function renderScroll(){
  const host = document.getElementById('scroll-inner');
  const s = curSession();
  host.innerHTML = '';

    host.appendChild(frontis());

  }

  s.msgs.forEach((m, i) => box.appendChild(buildBeat(m, i, s)));
  host.appendChild(box);
  /* 选项区（最新一幕若有） */
  const area = choicesArea(s);
  if (area.childNodes.length) host.appendChild(area);
  host.scrollTop = host.scrollHeight;
}
function frontis(){

function emptyNote(){
  const n = el('div', 'empty-note');
  n.innerHTML = `
    <div class="en-glyph">✦</div>
    <h3>信号静默</h3>
    <p>这条世界线尚无观测记录。<br>在下方传输台发出第一条行动指令。</p>`;

}
function buildBeat(m, i, s){
  if (m.role === 'user'){
    const u = el('div', 'userline' + (m.pick ? ' pick' : ''));
    u.innerHTML = `<span class="ul-role">${m.pick ? 'PICK' : 'UPLINK'}</span><div class="ul-body">${esc(m.content)}</div>`;
    return u;
  }
  const b = el('div', 'beat' + (i === s.msgs.length - 1 ? ' last' : ''));
  if (m.commit) b.dataset.commit = m.commit;
  if (m.error) b.classList.add('error');
  if (m.illust) b.dataset.illust = '1';
  const narr = el('div', 'beat-narr');
  narr.innerHTML = renderNarrative(m.content);
  const slot = el('div', 'beat-seal-slot');
  b.append(narr, slot);
  if (m.commit) renderSealFor(b, m, false);
  /* 观测附注（每个助手幕的来源笺） */
  if (!m.error){
    const note = el('div', 'zhu-note');
    note.innerHTML = `<span class="zhu-b">OBS</span><div class="zhu-txt">${m.zhuText || '此幕叙事由世界内核生成，可直接续传观测。'}</div>
      <div class="zhu-ops">
        <button data-op="copy">抄录附注</button>
        <button data-op="fork">另开一线</button>
        <button data-op="illust">配影像</button>
      </div>`;
    note.querySelector('[data-op="copy"]').onclick = () => { navigator.clipboard && navigator.clipboard.writeText(m.content).catch(() => {}); toast('已抄录到剪贴板', 'ok'); };
    note.querySelector('[data-op="fork"]').onclick = () => forkAt(s, m);
    note.querySelector('[data-op="illust"]').onclick = () => drawIllustFor(s, m, note);
    b.appendChild(note);
  }
  return b;
}
function renderSealFor(beatEl, m, fresh){
  const slot = beatEl.querySelector('.beat-seal-slot');
  if (!slot) return;
  slot.innerHTML = '';
  const seal = el('div', 'beat-seal');
  const glyph = ledgerCount(m.patch);
  seal.innerHTML = `<span class="seal-glyph">◈</span><span class="seal-txt">${m.commit === 'ok' ? (glyph ? `信标已亮 · ${glyph} 笔` : '信标已亮') : '轨道同步中…'}</span>`;
  if (m.commit === 'pending'){
    seal.classList.add('pending');
    seal.innerHTML = `<span class="seal-glyph">◈</span><span>待同步 · <button data-retry>立即补录</button></span>`;
    seal.querySelector('[data-retry]').onclick = () => { m.commit = 'ok'; applyLedger(m.patch); pushTurnLog('ok', m.patch); renderAll(); toast('状态已补录', 'ok'); };
  }
  slot.appendChild(seal);
  requestAnimationFrame(() => seal.classList.add('stamped'));
}
function choicesArea(s){
  const wrap = el('div', 'choices-area');
  if (!s) return wrap;
  const last = [...s.msgs].reverse().find(m => m.role === 'assistant' && !m.error);
  if (!last) return wrap;
  const chs = parseChoices(last.content);
  if (!chs.length) return wrap;
  const box = el('div', 'choices');
  chs.forEach(c => {
    const btn = el('button', 'choice');
    btn.dataset.k = c.key;
    btn.innerHTML = `<span>${esc(c.label)}</span>`;
    btn.onclick = () => pickChoice(c);
    box.appendChild(btn);
  });
  wrap.appendChild(box);
  return wrap;
}
function renderAll(){ renderStarmap(); renderScroll(); refreshDeck(); }

/* —— 身世开卷 —— */
function startWithOrigin(oid){
  const o = ORIGINS.find(x => x.id === oid) || ORIGINS[0];
  let s = curSession();
  if (!s || s.msgs.length){ s = newSession(o.label); store.curId = s.id; }
  const story = STORY_OPEN(o.label);
  const sp = splitPatch(story.raw);
  s.msgs.push(
    { role:'user', content:`出身坐标 · ${o.label}`, pick:true },
    { role:'assistant', content:story.raw, patch:sp.patch, commit:null },
  );
  renderAll();
  typewriteBeat(s.msgs[1], s);
}
function typewriteBeat(m, s){
  const beats = document.querySelectorAll('#scroll-inner .beat');
  const last = beats[beats.length - 1];
  if (!last){ return; }
  const narr = last.querySelector('.beat-narr');
  const text = m.content.replace(/<<<STATE_PATCH>>>[\s\S]*?<<<END_PATCH>>>/, '').trim();
  window.__busy = true;
  setProc('RX');
  typewrite(narr, text, { cps: 105, onDone: () => {
    window.__busy = false;
    setProc('IDLE');
    simulateCommit(s, m);
    renderSealFor(last, m, true);
    refreshDeck(); renderStarmap();
    /* 重新渲染以露出附注与选项 */
    renderScroll();
  }});
}
function setProc(t){ const p = document.getElementById('ct-proc'); if (p) p.textContent = t; }
</script>
<script>
/* ============================================================

/* —— 选项与自由输入 —— */
function pickChoice(c){
  if (busy) return;

}
function forkAt(s, m){
  const idx = s.msgs.indexOf(m);
  if (idx < 0) return;
  const fork = forkSession(s.id, idx);
  if (!fork) return;
  store.sessions.unshift(fork);
  store.curId = fork.id;
  renderAll();
  toast(`已另开一线：${fork.title}`, 'ok');
}
function drawIllustFor(s, m, anchor){
  const cap = (m.content.split('\n').find(l => l.includes('｜')) || s.title).replace(/[【】]/g, '');
  const kind = /深夜|夜/.test(m.content) ? 'night' : 'day';
  const svg = ILLUSTR.scene(cap, kind);
  illustGallery.unshift({ cap, svg, at: now() });
  m.illust = true;
  /* 就地插入观测影像 */
  const w = el('div', 'illust-wrap');
  w.innerHTML = `<span class="il-tag">CAPTURED FRAME</span>${svg}`;
  if (anchor && anchor.parentElement) anchor.parentElement.insertBefore(w, anchor.nextSibling);
  refreshBadge('badge-gallery', true);
  toast('已配影像 · 收入影像库', 'ok');
  renderScroll();
}
function refreshBadge(id, on){
  const b = document.getElementById(id);
  if (b) b.classList.toggle('on', !!on);
}

/* —— 回合发送 —— */
async function sendTurn(text, opts = {}){
  const s = curSession();
  if (!s){ toast('先在星图上新建一条世界线', 'warn'); return; }
  if (busy) return;
  const content = String(text || '').trim();
  if (!content){ toast('指令为空', 'warn'); return; }
  busy = true; window.__busy = true; setProc('TX');
  s.msgs.push({ role:'user', content, pick: !!opts.pick });
  renderScroll();
  const input = document.getElementById('com-input');
  if (input) input.value = '';
  await sleep(420);
  const pool = TURN_POOL[(s.msgs.filter(m => m.role === 'assistant').length) % TURN_POOL.length];
  const sp = splitPatch(pool.raw);
  const asst = { role:'assistant', content:pool.raw, patch:sp.patch, commit:null };
  s.msgs.push(asst);
  renderScroll();
  const ok = await typewriteBeatAsync(asst, s);
  busy = false; window.__busy = false; setProc('IDLE');
}
function typewriteBeatAsync(m, s){
  return new Promise(resolve => {
    const beats = document.querySelectorAll('#scroll-inner .beat');
    const last = beats[beats.length - 1];
    if (!last){ resolve(); return; }
    const narr = last.querySelector('.beat-narr');
    const text = m.content.replace(/<<<STATE_PATCH>>>[\s\S]*?<<<END_PATCH>>>/, '').trim();
    typewrite(narr, text, { cps: 105, onDone: () => {
      simulateCommit(s, m);
      renderSealFor(last, m, true);
      refreshDeck(); renderStarmap();
      renderScroll();
      resolve();
    }});
  });
}

/* —— 会话管理 —— */
function switchSession(id){
  if (busy) { toast('同步进行中，稍候', 'warn'); return; }
  store.curId = id;
  renderAll();
  toast('已切至目标世界线');
}
function deleteSession(s){
  const idx = store.sessions.indexOf(s);
  if (idx >= 0) store.sessions.splice(idx, 1);
  if (store.curId === s.id) store.curId = (store.sessions[0] || {}).id || null;
  renderAll();
  toast('世界线已散佚', 'warn');
}
async function newLine(){
  const name = await confirmDialog({ title:'新建世界线', body:'为新的观测对象命名：', withInput:true, placeholder:'未命名的星辰' });
  if (!name) return;
  const s = newSession(name);
  store.curId = s.id;
  renderAll();
  toast('新世界线已点亮，选定出身坐标', 'ok');
}
function confirmDialog({ title, body, okText = '确认', cancelText = '取消', withInput = false, placeholder = '', danger = false }){
  return new Promise(resolve => {
    const mask = document.getElementById('dialog-mask');
    const d = document.getElementById('dialog');
    d.innerHTML = `
      <h3>${esc(title)}</h3>
      <div class="d-body">${esc(body)}</div>
      ${withInput ? `<input class="d-input" id="dlg-input" placeholder="${esc(placeholder)}">` : ''}
      <div class="d-ops">
        <button class="btn ghost" id="dlg-cancel">${esc(cancelText)}</button>
        <button class="btn ${danger ? 'danger' : 'primary'}" id="dlg-ok">${esc(okText)}</button>
      </div>`;
    mask.classList.add('open');
    const inp = document.getElementById('dlg-input');
    if (inp){ inp.focus(); inp.onkeydown = e => { if (e.key === 'Enter'){ finish(inp.value.trim()); } }; }
    const finish = v => { mask.classList.remove('open'); resolve(v); };
    document.getElementById('dlg-cancel').onclick = () => finish(withInput ? '' : false);
    document.getElementById('dlg-ok').onclick = () => finish(withInput ? (inp.value.trim() || '') : true);
  });
}

/* ============================================================

  body.querySelectorAll('[data-delsnap]').forEach(b => b.onclick = () => {
    snaps.splice(+b.dataset.delsnap, 1); renderLedgerDrawer(); refreshDeck();
  });
  body.querySelectorAll('[data-restore]').forEach(b => b.onclick = () => {
    const sn = snaps[+b.dataset.restore];
    if (sn && sn.sid){ store.curId = sn.sid; }

    toast(`已回溯至 ${sn ? sn.name : ''}`, 'ok');

  body.querySelectorAll('[data-commitlog]').forEach(b => b.onclick = () => {
    const t = turnLogs[+b.dataset.commitlog];
    if (t && t.patch){ applyLedger(t.patch); t.status = 'ok'; renderLedgerDrawer(); refreshDeck(); renderStarmap(); toast('已补录', 'ok'); }
  });
}

    main.innerHTML = `
      <div class="design-host">
        <div class="design-wrap">
          <div class="dsn-head">

            <div class="f-sub">当前工作区装载的内核决定叙事风格与台账结构。你可以从内核库选用现成的，也可以与设计助手从零起草。</div>
          </div>
          <div class="dsn-sec">
            <h2>契约检查点</h2>

          </div>

function renderDsnChecks(){
  const host = document.getElementById('dsn-checks');
  if (!host) return;
  const CHECKS = [
    ['世界观声明', '内核必须声明自己的叙事边界与基调。'],
    ['身世笺集', '至少三条出身，决定玩家的初始坐标。'],
    ['选项契约', '每幕必出【你需要决定】与至少两笺。'],
    ['状态协议', '<<<STATE_PATCH>>> 结构合法，不合法不提交。'],
    ['台账映射', '九大台账各有落位，无悬空字段。'],
    ['回合上限', '单幕叙事不超过 2000 字。'],
    ['署名与版本', '内核须有版本号与作者署名。'],
  ];
  host.innerHTML = CHECKS.map((c, i) => `
    <div class="checkline ${i < 5 ? 'done' : ''}" data-i="${i}">
      <div class="ck-box">✓</div>
      <div class="ck-body">
        <div class="ck-title">${c[0]}</div>
        <div class="ck-desc">${c[1]}</div>
      </div>
    </div>`).join('');
  const done = host.querySelectorAll('.checkline.done').length;
  document.getElementById('dp-num').textContent = `${done}/${CHECKS.length}`;
  document.getElementById('dp-fill').style.width = (done / CHECKS.length * 100) + '%';
  host.querySelectorAll('.ck-box').forEach(bx => bx.onclick = () => {
    const line = bx.parentElement;
    line.classList.toggle('done');
    const done2 = host.querySelectorAll('.checkline.done').length;
    document.getElementById('dp-num').textContent = `${done2}/${CHECKS.length}`;
    document.getElementById('dp-fill').style.width = (done2 / CHECKS.length * 100) + '%';
  });
}
function renderDsnKernels(){
  const host = document.getElementById('dsn-kernels');
  if (!host) return;
  const ws = WORKSPACES.find(w => w.id === store.wsId) || WORKSPACES[0];
  host.innerHTML = KERNELS.map(k => `
    <button class="kcard ${k.status === 'draft' ? 'draft' : ''} ${k.status === 'archived' ? 'archived' : ''} ${k.id === ws.kernelId ? 'applied' : ''}" data-kid="${k.id}">
      <div class="kc-top"><span class="kc-title">${esc(k.title)}</span><span class="kc-ver">${esc(k.version)}</span></div>
      <div class="kc-sub">${esc(k.sub)}</div>
      <div class="kc-tags">${k.tags.map(t => `<span class="kc-tag">${esc(t)}</span>`).join('')}</div>
    </button>`).join('');
  host.querySelectorAll('.kcard').forEach(c => c.onclick = () => {
    const k = KERNELS.find(x => x.id === c.dataset.kid);

    if (ws2) ws2.kernelId = k.id;
    renderDsnKernels();
    toast(`已装载内核：${k.title}`, 'ok');

}

/* 桌宠：信标卫星 */
let petSleeping = false;
function petSay(msg, title){
  const bub = document.getElementById('pet-bubble');
  document.getElementById('pet-title').textContent = title || '信标卫星';
  document.getElementById('pet-text').textContent = msg;
  bub.classList.add('open');
  clearTimeout(petSay._t);
  petSay._t = setTimeout(() => bub.classList.remove('open'), 5200);
}
function petAnswer(q){
  for (const rule of PET_RULES){
    if (rule.re.test(q)) return rule.a;
  }
  return '讯号微弱……换个问法试试。比如问我「怎么开始」或「快捷键」。';
}
function petPoke(){
  if (petSleeping){ petWake(); return; }
  petSay(PET_TIPS[Math.floor(Math.random() * PET_TIPS.length)], '信标卫星 · 今日讯号');
}
function petWake(){
  petSleeping = false;
  const face = document.getElementById('pet-face');
  face.textContent = '🛰';
  face.classList.remove('sleep');
  petSay('重新入轨。信号满格。', '信标卫星 · 苏醒');
}
function petDoSleep(){
  petSleeping = true;
  const face = document.getElementById('pet-face');
  face.textContent = '💤';
  face.classList.add('sleep');
  petSay('进入低功耗轨道。点击卫星可唤醒。', '信标卫星 · 休眠');
}

/* 命令面板 */
const CMDK_ITEMS = [
  { g:'观测', label:'新建世界线', k:'', run: () => newLine() },
  { g:'观测', label:'打开观测台账', k:'Ctrl P', run: () => openDrawer('ledger') },
  { g:'观测', label:'打开影像库', k:'Ctrl G', run: () => openDrawer('gallery') },
  { g:'外观', label:'切到夜班', k:'', run: () => setMode('night') },
  { g:'外观', label:'切到昼班', k:'', run: () => setMode('day') },
  { g:'外观', label:'外观设置', k:'', run: () => openDrawer('theme') },
  { g:'内核', label:'进入内核设计', k:'', run: () => switchMode('design') },
  { g:'内核', label:'回到观测', k:'', run: () => switchMode('observe') },
  { g:'桌宠', label:'信标卫星今日讯号', k:'', run: () => petSay(PET_TIPS[Math.floor(Math.random() * PET_TIPS.length)], '信标卫星 · 讯号') },
  { g:'桌宠', label:'信标卫星休眠', k:'', run: () => petDoSleep() },
];
let cmdkOpen = false;
function openCmdk(){
  cmdkOpen = true;
  const mask = document.getElementById('cmdk-mask');
  mask.classList.add('open');
  const input = document.getElementById('cmdk-input');
  input.value = '';
  input.focus();
  renderCmdk('');
}
function closeCmdk(){
  cmdkOpen = false;
  document.getElementById('cmdk-mask').classList.remove('open');
}
function renderCmdk(q){
  const list = document.getElementById('cmdk-list');
  const items = CMDK_ITEMS.filter(i => !q || i.label.includes(q) || i.g.includes(q));
  const groups = [...new Set(items.map(i => i.g))];
  list.innerHTML = groups.map(g => `
    <div class="cmdk-group">${g}</div>
    ${items.filter(i => i.g === g).map(i => `
      <button class="cmdk-item" data-run="${CMDK_ITEMS.indexOf(i)}">
        <span>${esc(i.label)}</span><span class="ck-k">${i.k || ''}</span>
      </button>`).join('')}`).join('') || '<div style="padding:16px; color:var(--star-faint); font-size:12px;">无匹配命令。</div>';
  list.querySelectorAll('.cmdk-item').forEach(b => b.onclick = () => { closeCmdk(); CMDK_ITEMS[+b.dataset.run].run(); });
}

/* ============================================================
   事件绑定 / 启动
   ============================================================ */
function bindEvents(){
  document.getElementById('btn-newline').onclick = newLine;
  document.getElementById('btn-newline2').onclick = newLine;
  document.getElementById('btn-gallery').onclick = () => openDrawer('gallery');
  document.getElementById('btn-hud').onclick = () => openDrawer('ledger');
  document.getElementById('btn-theme').onclick = () => openDrawer('theme');
  document.getElementById('btn-help').onclick = () => openDrawer('help');
  document.getElementById('btn-search').onclick = () => { openDrawer('search'); setTimeout(() => document.getElementById('search-input').focus(), 80); };
  document.getElementById('btn-night').onclick = () => setMode(store.mode === 'night' ? 'day' : 'night');
  document.getElementById('tab-observe').onclick = () => switchMode('observe');
  document.getElementById('tab-design').onclick = () => switchMode('design');
  document.getElementById('btn-scope').onclick = () => {
    const b = document.getElementById('bridge');
    const wide = innerWidth > 1080;
    if (wide){ b.classList.toggle('scope-collapsed'); }
    else { b.classList.toggle('scope-open'); }
    document.getElementById('btn-scope').classList.toggle('on');
  };
  const input = document.getElementById('com-input');
  const send = document.getElementById('com-send');
  send.onclick = () => sendTurn(input.value);
  input.onkeydown = e => {
    if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendTurn(input.value); }
  };
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  });
  const multi = document.getElementById('com-multi');
  multi.onclick = () => { multiMode = !multiMode; multi.classList.toggle('on', multiMode); toast(multiMode ? '多选编队开：可连续点选多个选项' : '多选编队关'); };
  const spark2 = document.getElementById('com-spark2');
  spark2.onclick = () => {
    const insp = INSPIRES[Math.floor(Math.random() * INSPIRES.length)];
    input.value = insp;
    input.dispatchEvent(new Event('input'));
    input.focus();
    toast('灵感脉冲已注入（不耗 token）', 'ok');
  };
  /* 桌宠 */
  const pet = document.getElementById('pet');
  pet.onclick = () => petPoke();
  const bubble = document.getElementById('pet-bubble');
  bubble.onclick = e => e.stopPropagation();
  document.getElementById('pb-ask').onclick = async () => {
    const q = await confirmDialog({ title:'询问信标卫星', body:'想问什么？', withInput:true, placeholder:'比如：怎么开始？' });
    if (q) petSay(petAnswer(q), '信标卫星 · 应答');
  };
  document.getElementById('pb-tip').onclick = () => petSay(PET_TIPS[Math.floor(Math.random() * PET_TIPS.length)], '信标卫星 · 讯号');
  document.getElementById('pb-sleep').onclick = () => petDoSleep();
  /* 抽屉/灯箱/命令面板遮罩 */
  document.getElementById('lightbox').onclick = () => document.getElementById('lightbox').classList.remove('open');
  const cmdkMask = document.getElementById('cmdk-mask');
  cmdkMask.onclick = e => { if (e.target === cmdkMask) closeCmdk(); };
  const cmdkInput = document.getElementById('cmdk-input');
  cmdkInput.oninput = () => renderCmdk(cmdkInput.value.trim());
  cmdkInput.onkeydown = e => {
    if (e.key === 'Enter'){
      const first = document.querySelector('.cmdk-item');
      if (first){ closeCmdk(); CMDK_ITEMS[+first.dataset.run].run(); }
    }
    if (e.key === 'Escape') closeCmdk();
  };
  /* 全局快捷键 */
  addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && !e.altKey){
      const k = e.key.toLowerCase();
      if (k === 'k'){ e.preventDefault(); cmdkOpen ? closeCmdk() : openCmdk(); }
      else if (k === 'p'){ e.preventDefault(); openDrawer('ledger'); }
      else if (k === 'g'){ e.preventDefault(); openDrawer('gallery'); }
      else if (k === 'f'){ e.preventDefault(); openDrawer('search'); setTimeout(() => document.getElementById('search-input').focus(), 80); }
      else if (k === '/'){ e.preventDefault(); openDrawer('help'); }
      else if (k === '1'){ e.preventDefault(); document.getElementById('btn-scope').click(); }
    }
    if (e.key === 'Escape'){
      closeDrawer();
      document.getElementById('lightbox').classList.remove('open');
    }
  });
  /* 检索输入 */
  document.getElementById('search-input').oninput = renderSearchDrawer;
  /* 品牌点击回观测 */
  document.getElementById('brand').onclick = () => switchMode('observe');
}

  applyAppearance();
  bindEvents();
  renderAll();
  const first = PET_TIPS[0];
  setTimeout(() => { petSay('观测站就绪。星域空旷——「＋新线」点亮你的第一颗星辰。', '信标卫星 · 开机'); }, 600);
}
document.addEventListener('DOMContentLoaded', boot);
if (document.readyState !== 'loading') boot();
